[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whisper-writer"
version = "1.0.1"
description = "A small speech-to-text app that uses OpenAI's Whisper model to auto-transcribe microphone recordings."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "audioplayer>=0.6",
    "faster-whisper>=1.0.2",
    "numpy>=1.24",
    "openai>=1.28",
    "pyinstaller>=6.20.0",
    "pynput>=1.7",
    "pywhispercpp>=1.5",
    "llama-cpp-python>=0.3.38",
    "PyQt5>=5.15,<5.15.11",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "webrtcvad-wheels>=2.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pyright>=1.1.409",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
constraint-dependencies = [
    "pyqt5-qt5==5.15.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

# GPU builds of two native libraries.
# PyPI only ships CPU-only Windows wheels of pywhispercpp and llama-cpp-python, so on Windows these
# two are taken from ./vendor, a local "flat" package index that scripts/setup.ps1 fills by
# compiling them once with Vulkan enabled (works on AMD, NVIDIA and Intel GPUs). See docs/gpu-acceleration.md.
# On other platforms they come from PyPI as usual.
[[tool.uv.index]]
name = "vendor"
url = "vendor"
format = "flat"
explicit = true

[tool.uv.sources]
pywhispercpp = { index = "vendor", marker = "sys_platform == 'win32'" }
llama-cpp-python = { index = "vendor", marker = "sys_platform == 'win32'" }
